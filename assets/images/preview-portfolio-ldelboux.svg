<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#161211"/>

  <!-- player frame -->
  <rect x="120" y="60" width="560" height="300" rx="10" fill="#1A1816" stroke="#241A18" stroke-width="2"/>
  <rect x="120" y="60" width="560" height="300" rx="10" fill="none" stroke="#E3D9D0" stroke-width="1" opacity="0.15"/>

  <!-- play button, pulsing -->
  <g>
    <circle cx="400" cy="185" r="52" fill="#3A1418" opacity="0.9">
      <animate attributeName="r" values="52;58;52" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.6;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <polygon points="384,160 384,210 428,185" fill="#1A1816"/>
  </g>

  <!-- control bar -->
  <rect x="150" y="300" width="500" height="6" rx="3" fill="#241A18"/>
  <rect x="150" y="300" width="220" height="6" rx="3" fill="#E63946">
    <animate attributeName="width" values="120;220;120" dur="4s" repeatCount="indefinite"/>
  </rect>
  <circle cx="370" cy="303" r="8" fill="#E3D9D0">
    <animate attributeName="cx" values="270;370;270" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- transport icons -->
  <polygon points="150,326 150,342 162,334" fill="#E3D9D0"/>
  <rect x="172" y="326" width="4" height="16" fill="#E3D9D0"/>
  <rect x="180" y="326" width="4" height="16" fill="#E3D9D0"/>

  <!-- timestamp dashes -->
  <rect x="600" y="330" width="50" height="8" rx="2" fill="#241A18"/>

  <!-- fullscreen brackets -->
  <path d="M636 326 h10 v10 M636 326 v10 h10" stroke="#E3D9D0" stroke-width="2" fill="none"/>
</svg>
